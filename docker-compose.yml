services:
  ollama:
    build: .
    container_name: llm-propio-ollama
    ports:
      - "8000:8000"                    # proxy cifrado (cara pública)
      - "127.0.0.1:11434:11434"         # Ollama directo, solo accesible en local
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      OLLAMA_KEEP_ALIVE: "-1"
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Define ENCRYPTION_SECRET en .env}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      PROXY_PORT: "8000"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
